<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Campus Assistant</title>

  <!-- Tailwind + External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/annyang@2.6.0/dist/annyang.min.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <div id="vanta-bg"></div>

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg">
    <div class="container mx-auto px-4 py-6 flex space-x-2 items-center">
      <img src="robo.jpg" alt="Nova Language Chatbot Logo" class="w-8 h-8" />
      <h1 class="text-2xl font-bold">Nova Language Chatbot</h1>
    </div>
  </header>

  <!-- Main Section -->
  <section class="flex-grow container mx-auto px-4 py-6">
    <div class="bg-white rounded-xl shadow-xl overflow-hidden max-w-4xl mx-auto flex flex-col h-[600px]">

      <!-- Language Selector -->
      <div class="bg-indigo-50 p-3 flex overflow-x-auto space-x-2">
        <button onclick="changeLanguage('en','en-US')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/gb.png" class="language-flag"/>English
        </button>
        <button onclick="changeLanguage('hi','hi-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag"/>हिंदी
        </button>
        <button onclick="changeLanguage('bn','bn-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/bd.png" class="language-flag"/>বাংলা
        </button>
        <button onclick="changeLanguage('te','te-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag"/>తెలుగు
        </button>
        <button onclick="changeLanguage('mr','mr-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag"/>मराठी
        </button>
        <button onclick="changeLanguage('raj','hi-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag"/>राजस्थानी
        </button>
      </div>

      <!-- Messages -->
      <div class="flex-grow overflow-y-auto p-4 flex flex-col" id="chat-container">
        <div class="chat-bubble bot-bubble"><p>👋 Hello! Select your language above and ask me a campus/college question.</p></div>
      </div>

      <!-- Input -->
      <div class="border-t border-gray-200 p-4">
        <div class="flex items-center">
          <input id="chat-input" placeholder="Type your message..." class="flex-grow border rounded-full px-4 py-2"/>
          <button id="send-btn" class="ml-2 bg-indigo-600 text-white p-2 rounded-full">
            <i data-feather="send"></i>
          </button>
          <button id="mic-btn" class="ml-2 bg-gray-200 text-gray-700 p-2 rounded-full hover:bg-gray-300">
            <i data-feather="mic"></i>
          </button>
        </div>
        <div id="recording-status" class="text-xs text-gray-500 mt-1 hidden">🎤 Listening...</div>
      </div>
    </div>
  </section>

  <!-- JS -->
  <script src="app.js"></script>
</body>
</html>
