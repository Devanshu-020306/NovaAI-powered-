<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nova Campus Assistant</title>

  <!-- Tailwind + External Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.waves.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/annyang@2.6.0/dist/annyang.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
  <div id="vanta-bg"></div>

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-lg">
    <div class="container mx-auto px-4 py-6 flex space-x-2 items-center">
      <img src="robo.jpg" alt="Nova Assistant Logo" class="w-8 h-8" />
      <h1 class="text-2xl font-bold">Nova Campus Assistant</h1>
    </div>
  </header>

  <!-- Main Section -->
  <section class="flex-grow container mx-auto px-4 py-6">
    <div class="bg-white rounded-xl shadow-xl overflow-hidden max-w-4xl mx-auto flex flex-col h-[600px]">

      <!-- Languages -->
      <div class="bg-indigo-50 p-3 flex overflow-x-auto space-x-2">
        <button onclick="changeLanguage('en','en-US')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/gb.png" class="language-flag mr-1"/>English
        </button>
        <button onclick="changeLanguage('hi','hi-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag mr-1"/>हिंदी
        </button>
        <button onclick="changeLanguage('bn','bn-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/bd.png" class="language-flag mr-1"/>বাংলা
        </button>
        <button onclick="changeLanguage('te','te-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag mr-1"/>తెలుగు
        </button>
        <button onclick="changeLanguage('mr','mr-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag mr-1"/>मराठी
        </button>
        <button onclick="changeLanguage('raj','hi-IN')" class="flex items-center px-3 py-1 bg-white rounded-full text-sm">
          <img src="https://flagcdn.com/24x18/in.png" class="language-flag mr-1"/>राजस्थानी
        </button>
      </div>

      <!-- Chat -->
      <div class="flex-grow overflow-y-auto p-4 flex flex-col" id="chat-container">
        <div class="chat-bubble bot-bubble bg-indigo-100 p-3 rounded-xl w-fit max-w-xs">
          👋 Hello! Select your language above and ask me a campus/college question.
        </div>
      </div>

      <!-- Input -->
      <div class="border-t border-gray-200 p-4">
        <div class="flex items-center">
          <input id="chat-input" placeholder="Type your message..." class="flex-grow border rounded-full px-4 py-2"/>
          <button id="send-btn" class="ml-2 bg-indigo-600 text-white p-2 rounded-full">
            <i data-feather="send"></i>
          </button>
          <button id="mic-btn" class="ml-2 bg-gray-200 text-gray-700 p-2 rounded-full hover:bg-gray-300">
            <i data-feather="mic"></i>
          </button>
        </div>
        <div id="recording-status" class="text-xs text-gray-500 mt-1 hidden">🎤 Listening...</div>
      </div>
    </div>
  </section>

  <!-- Script -->
  <script>
    feather.replace();

    // Background waves
    let vantaEffect = null;
    function setBackground(lang) {
      if(vantaEffect) vantaEffect.destroy();
      let color = 0x3b82f6; // blue default
      if(lang==="hi") color=0xf59e0b;
      if(lang==="bn") color=0x10b981;
      if(lang==="te") color=0x8b5cf6;
      if(lang==="mr") color=0xef4444;
      if(lang==="raj") color=0x14b8a6;
      vantaEffect = VANTA.WAVES({ el:"#vanta-bg", color:color, waveHeight:20, shininess:50, waveSpeed:0.5, zoom:0.8 });
    }
    setBackground("en");

    const chatContainer=document.getElementById("chat-container");
    const chatInput=document.getElementById("chat-input");
    const sendBtn=document.getElementById("send-btn");
    const micBtn=document.getElementById("mic-btn");
    const recordingStatus=document.getElementById("recording-status");

    let currentLang="en"; 
    let ttsLang="en-US"; 
    let sttLang="en-US"; 

    const responses={
      en:{hello:"Hello! How can I help?", fee:"Fee deadline is the 25th.", scholarship:"Forms at admin office.", timetable:"Timetable is on the notice board.", cutoff:"Download cutoff: <a href='https://example.com/cutoff.pdf'>PDF</a>", default:"I don’t know that yet."},
      hi:{hello:"नमस्ते! मैं आपकी कैसे मदद कर सकता हूँ?", fee:"फीस जमा करने की अंतिम तिथि २५ है।", scholarship:"स्कॉलरशिप फॉर्म दफ्तर में है।", timetable:"टाइमटेबल नोटिस बोर्ड पर है।", cutoff:"कटऑफ डाउनलोड करें: <a href='https://example.com/cutoff.pdf'>PDF</a>", default:"मुझे इसका उत्तर नहीं पता।"},
      bn:{hello:"হ্যালো! আমি কীভাবে সাহায্য করতে পারি?", fee:"ফি জমার শেষ তারিখ ২৫।", scholarship:"স্কলারশিপ ফর্ম অফিসে আছে।", timetable:"টাইটেম নোটিস বোর্ডে আছে।", cutoff:"কাটঅফ ডাউনলোড: <a href='https://example.com/cutoff.pdf'>PDF</a>", default:"আমি জানি না।"},
      te:{hello:"హలో! నేను ఎలా సహాయం చెయ్యగలను?", fee:"ఫీజు చివరి తేదీ 25.", scholarship:"స్కాలర్‌షిప్ ఫారమ్ కార్యాలయంలో ఉన్నాయి.", timetable:"టైమ్‌టేబుల్ నోటిస్ బోర్డులో ఉంది.", cutoff:"కట్ అఫ్ డౌన్‌లోడ్: <a href='https://example.com/cutoff.pdf'>PDF</a>", default:"నాకు తెలియదు."},
      mr:{hello:"नमस्कार! मी कशी मदत करू शकतो?", fee:"फी भरण्याची शेवटची तारीख २५.", scholarship:"शिष्यवृत्ती फॉर्म ऑफिसमध्ये आहेत.", timetable:"वेळापत्रक सूचना फलकावर आहे.", cutoff:"कटऑफ डाउनलोड इथे: <a href='https://example.com/cutoff.pdf'>PDF</a>", default:"मला माहित नाही."},
      raj:{hello:"राम राम सा! म्हे थाने केसरि मदत कर सकूं?", fee:"फीस भरन री तारीख २५ छे।", scholarship:"स्कॉलरशिप फार्म ऑफिस में हैं।", timetable:"नवां टाइमटेबल नोटिस बोर्ड पै लागेलो।", cutoff:"कटऑफ डाउनलोड करो: <a href='https://example.com/cutoff.pdf'>PDF</a>", default:"म्है नै खबर नी।"}
    };

    function changeLanguage(lang, voiceCode) {
      currentLang=lang; ttsLang=voiceCode; sttLang=voiceCode;
      addMessage("✅ Language changed: "+lang,"bot");
      setBackground(lang);
    }

    function addMessage(text,sender){
      const d=document.createElement("div");
      d.className=`chat-bubble ${sender}-bubble my-1 p-2 rounded-xl max-w-xs ${sender==='bot'?"bg-gray-100":"bg-indigo-500 text-white ml-auto"}`;
      d.innerHTML=text;
      chatContainer.appendChild(d);
      chatContainer.scrollTop=chatContainer.scrollHeight;
    }

    function findResponse(q){
      const dict=responses[currentLang]||responses.en; 
      q=q.toLowerCase();
      if(q.includes("hello")||q.includes("hi")||q.includes("नमस्ते")) return dict.hello;
      if(q.includes("fee")) return dict.fee;
      if(q.includes("scholar")) return dict.scholarship;
      if(q.includes("time")||q.includes("exam")) return dict.timetable;
      if(q.includes("cutoff")) return dict.cutoff;
      return dict.default;
    }

    function speak(text){
      if("speechSynthesis" in window){
        speechSynthesis.cancel();
        const u=new SpeechSynthesisUtterance(text.replace(/<[^>]+>/g,""));
        u.lang=ttsLang;
        const voices = speechSynthesis.getVoices();
        const match = voices.find(v => v.lang===ttsLang);
        if(match) u.voice=match;
        speechSynthesis.speak(u);
      }
    }

    function sendMessage(){
      const text=chatInput.value.trim();
      if(!text) return;
      addMessage(text,'user');
      chatInput.value="";
      const reply=findResponse(text);
      addMessage(reply,'bot');
      speak(reply);
    }

    sendBtn.onclick=sendMessage;
    chatInput.onkeypress=e=>{if(e.key==="Enter")sendMessage();};

    if(annyang){
      micBtn.onclick=()=>{
        if(annyang.isListening()){
          annyang.abort();
          micBtn.classList.remove("bg-red-500","text-white");
          micBtn.classList.add("bg-gray-200","text-gray-700");
          recordingStatus.classList.add("hidden");
        } else {
          annyang.setLanguage(sttLang);
          annyang.removeCommands();
          annyang.addCommands({"*text":t=>{chatInput.value=t;sendMessage();}});
          annyang.start();
          micBtn.classList.remove("bg-gray-200","text-gray-700");
          micBtn.classList.add("bg-red-500","text-white");
          recordingStatus.classList.remove("hidden");
        }
      };
    }

    // Just for voice debugging
    speechSynthesis.onvoiceschanged=()=>{console.log("Voices:", speechSynthesis.getVoices());};
  </script>
</body>
</html>
